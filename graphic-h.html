<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: absolute; top: 0; left: 0; overflow: hidden; }
  #img {
    position: absolute;
    transform-origin: center center;
    transition: opacity 0.3s;
    object-fit: contain;
  }
  #img.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><img id="img" class="hidden"></div>
<script>
  const WORKER = 'https://adp-show-graphics.mohn-edgar.workers.dev'; // ← fill in after deploy
  const LAYER  = 'graphics';
  const SLOT   = 'h';

  const params  = new URLSearchParams(location.search);
  const EVENT   = params.get('event') || 'default';

  const stage = document.getElementById('stage');
  const img   = document.getElementById('img');
  let currentKey = null;
  let currentRes = null;

  function fitStage(w, h) {
    const s = Math.min(window.innerWidth / w, window.innerHeight / h);
    stage.style.left = '50%';
    stage.style.top  = '50%';
    stage.style.transformOrigin = 'center center';
    stage.style.transform = s < 0.999
      ? `translate(-50%, -50%) scale(${s})`
      : 'translate(-50%, -50%)';
  }

  function applyResolution(res) {
    if (currentRes && currentRes.w === res.w && currentRes.h === res.h) return;
    currentRes = res;
    stage.style.width  = res.w + 'px';
    stage.style.height = res.h + 'px';
    img.style.width  = res.w + 'px';
    img.style.height = res.h + 'px';
    requestAnimationFrame(() => fitStage(res.w, res.h));
  }

  // Poll rate self-adjusts on the power switch (state.power, from /active): fast while
  // the show is on, slow while off — a forgotten open tab costs ~0 instead of ~57.6k
  // requests/day. On a fetch error, retry at the fast interval rather than get stuck
  // slow — a transient blip should never delay recovery.
  const POLL_ON_MS  = 1500;
  const POLL_OFF_MS = 30000;

  async function poll() {
    let nextDelay = POLL_ON_MS;
    try {
      const res = await fetch(`${WORKER}/active?event=${EVENT}&layer=${LAYER}&slot=${SLOT}`, { cache: 'no-store' });
      const state = await res.json();
      if (state.resolution) applyResolution(state.resolution);
      if (state.power === false) {
        img.classList.add('hidden'); currentKey = null;
        nextDelay = POLL_OFF_MS;
      } else if (!state.live || !state.key) {
        img.classList.add('hidden'); currentKey = null;
      } else {
        if (state.key !== currentKey) {
          currentKey = state.key;
          img.classList.add('hidden');
          img.onload = () => img.classList.remove('hidden');
          img.onerror = () => { currentKey = null; }; // retry on next poll if load fails
          img.src = `${WORKER}/img/${encodeURIComponent(state.key)}`;
        }
        const s = (state.scale || 100) / 100;
        const r = state.rotate || 0;
        if (state.fit === 'cover') {
          img.style.objectFit = 'cover';
          img.style.transform = `scale(${Math.max(s, 1)}) rotate(${r}deg)`;
          img.style.left = '0'; img.style.top = '0';
        } else {
          img.style.objectFit = 'contain';
          img.style.transform = `translate(-50%, -50%) scale(${s}) rotate(${r}deg)`;
          img.style.left = (state.x || 50) + '%';
          img.style.top  = (state.y || 50) + '%';
        }
      }
    } catch(e) {}
    setTimeout(poll, nextDelay);
  }

  window.addEventListener('resize', () => { if (currentRes) fitStage(currentRes.w, currentRes.h); });
  poll();
</script>
</body>
</html>
